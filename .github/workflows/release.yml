# Makes a tag and a GitHub release for every new Forge version, once the tests pass on master.
#
# The version comes from kVersion in src/main.cpp, and the release notes from that version's section of
# CHANGELOG.md. A version that already has a release is skipped, so this is safe to run on every push.
# It can also be run by hand (Actions > release > Run workflow) to make a release page for an older version
# that's already tagged, like 0.6.0.
name: release

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to make a release page for, like 0.6.0 (leave empty for the current one)"
        required: false

permissions:
  contents: write
  actions: read   # to get the installer the tests run built

jobs:
  release:
    runs-on: ubuntu-latest
    # Only after a successful test run of a push to master (not a pull request), or when run by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Make the tag and release, if this version doesn't have one yet
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ github.event.inputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          version="${WANTED:-$(sed -n 's/.*kVersion = "\([^"]*\)".*/\1/p' src/main.cpp)}"
          if [ -z "$version" ]; then echo "Couldn't find kVersion in src/main.cpp"; exit 1; fi
          tag="v$version"

          # The notes: everything under "## <version>" in CHANGELOG.md, up to the next "## ".
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Forge $version." > notes.md; fi
          printf '\n**To install:** download `Forge-%s-setup.exe` below and run it. It includes everything Forge needs (its own C++ compiler too). Already have Forge? Run it to update; your games and settings stay.\n\n' "$version" >> notes.md
          echo "Full list of changes: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/$tag/CHANGELOG.md)" >> notes.md

          # A version that already has a release keeps it; only its notes are refreshed, so they always match
          # CHANGELOG.md (the tag isn't moved).
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --notes-file notes.md
            echo "$tag already has a release; its notes were refreshed from CHANGELOG.md."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            # Already tagged (by hand): make the release page for that tag.
            gh release create "$tag" --verify-tag --title "Forge $version" --notes-file notes.md
          else
            gh release create "$tag" --target "$SHA" --title "Forge $version" --notes-file notes.md
          fi
          echo "Made release $tag."

      # The installer the tests run built and tested (tests.yml, "installer"), attached once per version.
      - name: Get the installer from the tests run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: installer
          path: installer-out
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Attached when the release has none yet, or replaced when this run is for the very commit the version's tag
      # points at (so the installer and the tag always match).
      - name: Attach the installer to the release
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version="$(sed -n 's/.*kVersion = "\([^"]*\)".*/\1/p' src/main.cpp)"
          tag="v$version"
          tagged="$(git ls-remote origin "refs/tags/$tag^{}" | cut -f1)"
          [ -n "$tagged" ] || tagged="$(git ls-remote origin "refs/tags/$tag" | cut -f1)"
          if gh release view "$tag" --json assets -q '.assets[].name' | grep -q -- '-setup.exe$' && [ "$tagged" != "$SHA" ]; then
            echo "$tag already has its installer (from the tagged commit)."
            exit 0
          fi
          for f in installer-out/*-setup.exe; do gh release upload "$tag" "$f" --clobber; done
          echo "Attached the installer to $tag."
