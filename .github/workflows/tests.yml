# Builds frg.exe on Windows, runs every test in tests/cases, and builds every example game.
# Then a Linux job runs every example for a few frames (see tests/run_games.sh), and the window tests
# (see tests/run_window_tests.sh). The "linux" job does it all again with Forge for Linux, and packs it.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      FRG_NO_UPDATE_CHECK: "1"   # CI builds never look for a newer Forge
    steps:
      - uses: actions/checkout@v4

      # w64devkit has the same g++ (with C++20 coroutines), CMake and Ninja that Forge's users install.
      - name: Get w64devkit
        shell: pwsh
        run: |
          $url = "https://github.com/skeeto/w64devkit/releases/download/v2.0.0/w64devkit-x64-2.0.0.exe"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\w64devkit.exe"
          & "$env:RUNNER_TEMP\w64devkit.exe" -y "-o$env:RUNNER_TEMP" | Out-Null
          "$env:RUNNER_TEMP\w64devkit\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build frg
        shell: pwsh
        run: |
          g++ --version
          cmake -S . -B build -G Ninja
          cmake --build build

      # This machine can't open a window, so the window tests are only built here (into window-tests/),
      # and the run-games job runs them; the docs' examples that open a window are skipped.
      - name: Run the tests
        shell: pwsh
        env:
          FRG_NO_WINDOW: "1"
          FRG_COLLECT_WINDOW_TESTS: ${{ github.workspace }}/window-tests
        run: .\tests\run_tests.ps1

      - name: Keep the built window tests
        uses: actions/upload-artifact@v4
        with:
          name: window-tests
          path: window-tests/
          retention-days: 7

      - name: Build every example
        shell: pwsh
        run: |
          $failed = @()
          foreach ($dir in Get-ChildItem examples -Directory) {
            Write-Host "--- $($dir.Name)"
            & .\bin\frg.exe build $dir.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $dir.Name }
          }
          if ($failed.Count) { Write-Host "Examples that didn't build: $($failed -join ', ')"; exit 1 }

      # The built games go to the next job, without Forge's in-between C++ files.
      - name: Keep the built examples
        uses: actions/upload-artifact@v4
        with:
          name: built-examples
          path: |
            examples/
            !examples/*/build/forge/
          retention-days: 7

  # Builds the installer (installer/build.ps1), installs it on this machine, makes and builds a game with the
  # installed Forge with no other g++ on the PATH (so it has to use its own), and uninstalls it again.
  # The release workflow attaches the installer to the release.
  installer:
    needs: test
    runs-on: windows-latest
    env:
      FRG_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Get w64devkit and Inno Setup
        shell: pwsh
        run: |
          $url = "https://github.com/skeeto/w64devkit/releases/download/v2.0.0/w64devkit-x64-2.0.0.exe"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\w64devkit.exe"
          & "$env:RUNNER_TEMP\w64devkit.exe" -y "-o$env:RUNNER_TEMP" | Out-Null
          "$env:RUNNER_TEMP\w64devkit\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build frg
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build

      - name: Build the installer
        shell: pwsh
        run: .\installer\build.ps1 -W64devkit "$env:RUNNER_TEMP\w64devkit"

      - name: Install it, make a game with it, uninstall it
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer\out\Forge-*-setup.exe | Select-Object -First 1
          $dir = "$env:RUNNER_TEMP\ForgeInstalled"
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"", "/TASKS=path,fileicons" -Wait
          if (-not (Test-Path "$dir\bin\frg.exe")) { throw "frg.exe wasn't installed" }
          if (-not (Test-Path "$dir\w64devkit\bin\g++.exe")) { throw "the compiler wasn't installed" }
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($userPath -notlike "*$dir\bin*") { throw "Forge wasn't added to the PATH" }

          # no other g++: the installed frg has to find its own
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'w64devkit|mingw|msys|strawberry|cygwin' }) -join ';'
          if (Get-Command g++ -ErrorAction SilentlyContinue) { throw "another g++ is still on the PATH: $((Get-Command g++).Source)" }
          & "$dir\bin\frg.exe" version
          Set-Location $env:RUNNER_TEMP
          & "$dir\bin\frg.exe" new smoke --template window
          & "$dir\bin\frg.exe" build smoke
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path smoke\build\smoke.exe)) { throw "the installed Forge couldn't build a game" }

          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          # the uninstaller works from a copy of itself, so wait for it to finish
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\bin\frg.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\bin\frg.exe") { throw "the uninstaller left frg.exe" }
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($userPath -like "*$dir\bin*") { throw "the uninstaller left Forge on the PATH" }
          Write-Host "Installed, built a game and uninstalled: all good."

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer/out/*.exe
          retention-days: 30

  # Forge on Linux: builds frg with the system's g++, runs every test (the window tests on a virtual screen with
  # software drawing), builds every example but the low-level toolkits' (Windows-only), and packs Forge into
  # Forge-<version>-linux-x64.tar.gz, which the release workflow attaches to the release. Ubuntu 22.04, so that
  # frg runs on it and every newer Ubuntu.
  linux:
    runs-on: ubuntu-22.04
    env:
      FRG_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Get the compiler and the window libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends g++ cmake libgl1-mesa-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev xvfb libgl1-mesa-dri zip

      - name: Build frg
        run: |
          g++ --version
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4

      - name: Run the tests
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x720x24" pwsh -NoProfile -File tests/run_tests.ps1

      - name: Build every example
        run: |
          failed=""
          for dir in examples/*/; do
            name=$(basename "$dir")
            case "$name" in opengl|directx|vulkan) continue;; esac
            echo "--- $name"
            bin/frg build "$dir" || failed="$failed $name"
          done
          if [ -n "$failed" ]; then echo "Examples that didn't build:$failed"; exit 1; fi

      - name: Pack Forge for Linux
        run: |
          version="$(sed -n 's/.*kVersion = "\([^"]*\)".*/\1/p' src/main.cpp)"
          out="Forge-$version-linux-x64"
          mkdir -p "pack/$out/bin"
          cp bin/frg bin/forge-edit "pack/$out/bin/"
          cp -R bin/fonts "pack/$out/bin/fonts"
          mkdir -p "pack/$out/art" && cp art/forge-icon-512.png "pack/$out/art/"
          cp -R runtime "pack/$out/bin/runtime"
          rm -rf "pack/$out/bin/runtime/raylib/lib"   # raylib for Windows
          git archive HEAD docs examples README.md LICENSE CHANGELOG.md | tar -x -C "pack/$out"
          cp installer/linux/install.sh "pack/$out/"
          pwsh -NoProfile -File editors/vscode/package.ps1
          mkdir -p "pack/$out/editors" && cp "editors/vscode/dist/forge-$version.vsix" "pack/$out/editors/forge.vsix"
          chmod +x "pack/$out/install.sh" "pack/$out/bin/frg" "pack/$out/bin/forge-edit"
          tar -czf "$out.tar.gz" -C pack "$out"
          ls -la "$out.tar.gz"

          # it installs, and the installed Forge builds a game
          tar -xzf "$out.tar.gz" -C "$RUNNER_TEMP"
          HOME="$RUNNER_TEMP/home" sh "$RUNNER_TEMP/$out/install.sh"
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/home/.local/bin/frg" new smoke --template window && "$RUNNER_TEMP/home/.local/bin/frg" build smoke
          test -x smoke/build/smoke
          test -x "$RUNNER_TEMP/home/.local/bin/forge-edit"
          test -f "$RUNNER_TEMP/home/.local/share/applications/forge-edit.desktop"

      - name: Keep the Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Forge-*-linux-x64.tar.gz
          retention-days: 30

  # Runs every example for 180 frames with scripted keys and saves the last frame as a picture.
  # GitHub's Windows machines have no graphics card, so this runs the Windows .exe files on Linux under Wine,
  # with a virtual screen and software drawing (Mesa's llvmpipe for OpenGL and DirectX, lavapipe for Vulkan).
  # It catches games that crash, stop with a runtime error or hang; the pictures are kept as "screenshots".
  run-games:
    needs: test
    runs-on: ubuntu-24.04
    env:
      WINEDLLOVERRIDES: "mscoree,mshtml="   # don't ask to install Wine's .NET and browser parts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: built-examples
          path: games

      - uses: actions/download-artifact@v4
        with:
          name: window-tests
          path: window-tests

      - name: Install Wine, a virtual screen and software drawing
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends wine wine64 xvfb mesa-vulkan-drivers libgl1-mesa-dri bc
          wine --version
          WINEDEBUG=-all wineboot --init
          wineserver -w   # let it finish; otherwise games would reuse a Wine started without a screen

      - name: Run every example for 180 frames
        run: xvfb-run -a -s "-screen 0 1280x800x24" tests/run_games.sh games screenshots 180

      - name: Run the window tests (games that check what they print, frame by frame)
        run: xvfb-run -a -s "-screen 0 1280x800x24" tests/run_window_tests.sh window-tests

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
